[workspace]
resolver = "3"
members = ["crates/fo-core", "crates/fo-scene", "crates/fo-script", "crates/fo-cli", "crates/fo-mapper"]
default-members = ["crates/fo-mapper", "crates/fo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael Pegeot"]
rust-version = "1.85"

[workspace.dependencies]
fo-core = { path = "crates/fo-core" }
fo-scene = { path = "crates/fo-scene" }
fo-script = { path = "crates/fo-script" }

anyhow = "1"
thiserror = "2"
flate2 = "1"
rayon = "1"
clap = { version = "4", features = ["derive", "env"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
